# dsh-calm bundle patch：一行挂载。
# row name 必须等于包名——宿主按包名解析入口（@deepseek-ai/dsh-* 同款惯例）。
# 通过 `dsh plugin --profile <name> add dsh-calm` 安装后自动生效；
# 可调参数（window / enableTermination / denyPattern / allowRawSealedRead）
# 在 profile 的用户层覆盖，或直接编辑 profile 的 cordis.patch.yml。
- insert:
    - id: dsh-calm
      name: 'dsh-calm'
